name: Bulut APK

# Elle tetiklenir. Artefakt kotası dolu olduğu için çıktı Release olarak yayımlanır.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # packages: '' ZORUNLU. Action'ın varsayılanı "tools platform-tools"
      # kurmak; "tools" paketi SDK deposundan kaldırıldığı için sdkmanager
      # "Failed to find package 'tools'" deyip 1 dönüyor ve adım tamamen düşüyor.
      # Boş liste yalnızca cmdline-tools kurulumunu ve lisans onayını bırakıyor;
      # platform ve build-tools runner imajında zaten var, eksik kalanı AGP
      # kendisi indiriyor.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Sürüm Numarasını Oku
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Protokol ve ayrıştırıcı testleri; APK'dan önce koşuyor ve
      # başarısız olursa yayın yapılmıyor.
      - name: Birim Testleri
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest

      # Depoda imza gizlileri tanımlıysa yayın sürümü o anahtarla imzalanır.
      # Tanımlı değilse debug imzalı APK üretilir: kurulur ama imzası her
      # derlemede değiştiği için üstüne güncelleme yapılamaz.
      - name: İmza Anahtarını Hazırla
        id: imza
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "var=evet" >> "$GITHUB_OUTPUT"
          else
            echo "var=hayir" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 tanımlı değil, debug imzalı APK üretilecek."
          fi

      - name: APK Derle (imzalı)
        if: steps.imza.outputs.var == 'evet'
        run: |
          ./gradlew assembleRelease --stacktrace
          BT=$(ls "$ANDROID_HOME/build-tools/" | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk Bulut.apk

      - name: APK Derle (debug imzalı)
        if: steps.imza.outputs.var == 'hayir'
        run: |
          ./gradlew assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk Bulut.apk

      - name: Release Oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Bulut v${{ steps.version.outputs.version }}"
          files: Bulut.apk
          body: |
            Ücretsiz katmanlı bulut yapay zekâ API'leri (Gemini, Groq, OpenRouter, Mistral, Cerebras, GitHub Models) ve kendi sunucun için sohbet uygulaması.

            İmza: ${{ steps.imza.outputs.var == 'evet' && 'yayın anahtarı' || 'debug (her derlemede değişir, güncelleme için önce kaldırın)' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
