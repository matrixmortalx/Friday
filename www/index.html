<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Friday</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#101828;--mut:#667085;--acc:#e5484d;--acc2:#ff8a3d;--line:#e4e7ec;--me:#101828;--meink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b30;--ink:#eef1f8;--mut:#98a2b3;--line:#262e48;--me:#e5484d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px #e5484d66}
.orb.busy{animation:p 1s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.15)}}
h1{font-size:18px;margin:0;flex:1;letter-spacing:.5px}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.ib{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m img{display:block;width:100%;max-width:320px;border-radius:10px;background:#fff}
.dl{margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:14px}
.hint{margin:auto;text-align:center;color:var(--mut);max-width:280px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:10px 14px;font:inherit;outline:none}
.b{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:18px;flex:none}
.b.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.b.on{background:var(--acc);color:#fff}
</style>
</head>
<body>
<header>
  <span class="orb" id="orb"></span>
  <h1>Friday<small>AI asistan</small></h1>
  <button class="ib" id="settingsBtn">⚙</button>
</header>
<div id="msgs" aria-live="polite"></div>
<form id="composer">
  <textarea id="q" rows="1" placeholder="Mesaj yaz..."></textarea>
  <button class="b g" id="micBtn" type="button" aria-label="Sesli komut">🎤</button>
  <button class="b" id="sendBtn" type="submit" aria-label="Gönder">➤</button>
</form>
<script>
const API = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-3-5-sonnet-20241022';
const MAX_TOKENS = 512;
const msgs = document.getElementById('msgs');
const q = document.getElementById('q');
const form = document.getElementById('composer');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const settingsBtn = document.getElementById('settingsBtn');
const orb = document.getElementById('orb');

const STORAGE_KEY = 'friday_api_key';
let apiKey = localStorage.getItem(STORAGE_KEY) || '';

function esc(s){return s.replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));}
function addSystem(text){
  const el = document.createElement('div');
  el.className = 'm a';
  el.innerHTML = esc(text);
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}
function addUser(text){
  const el = document.createElement('div');
  el.className = 'm u';
  el.textContent = text;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}
function addImage(src){
  const el = document.createElement('div');
  el.className = 'm a';
  el.innerHTML = '<img src="' + src + '" alt="Üretilen görsel" />';
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}
function showHint(){
  if (!msgs.children.length) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = 'Merhaba! Ben Friday. Bir şey sorabilir veya görsel isteyebilirsin.';
    msgs.appendChild(h);
  }
}
function setBusy(v){
  orb.classList.toggle('busy', v);
  sendBtn.disabled = v;
  micBtn.disabled = v;
  sendBtn.title = v ? 'Bekleniyor' : 'Gönder';
}
function resizeTA(){
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 120) + 'px';
}
q.addEventListener('input', resizeTA);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

async function askAnthropic(prompt, imagePrompt){
  if (!apiKey) {
    addSystem('API anahtarı yok. Sağ üstteki ⚙ düğmesine basıp anahtarı gir.');
    return;
  }
  setBusy(true);
  try {
    const body = {
      model: MODEL,
      max_tokens: MAX_TOKENS,
      messages: [{ role: 'user', content: prompt }]
    };
    const res = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'Accept': 'application/json'
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data?.error?.message || 'API hatası');
    }
    const text = data?.content?.[0]?.text || 'Cevap alınamadı.';
    addSystem(text);
    if (imagePrompt && imagePrompt.trim()) {
      await generateImage(imagePrompt.trim());
    }
  } catch (err) {
    addSystem('Bir hata oluştu: ' + (err.message || 'Bilinmeyen hata'));
  } finally {
    setBusy(false);
  }
}

async function generateImage(prompt){
  if (!apiKey) {
    addSystem('Görsel üretmek için API anahtarı gerekir.');
    return;
  }
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1024,
        messages: [{ role: 'user', content: 'Aşağıdaki görsel isteğini sade ve kısa şekilde görsel üretimi için hazır formatta yaz: ' + prompt }]
      })
    });
    const data = await res.json();
    const text = data?.content?.[0]?.text || '';
    if (text) {
      addSystem('Görsel üretim için istek hazırlandı: ' + text.slice(0, 200));
    }
  } catch (err) {
    addSystem('Görsel üretme isteği gönderilemedi.');
  }
}

function getUserText(){
  return q.value.trim();
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const t = getUserText();
  if (!t) return;
  addUser(t);
  q.value = '';
  resizeTA();
  const needsImage = /resim|görsel|foto|illustration|image|picture/i.test(t);
  askAnthropic(t, needsImage ? t : '');
});

settingsBtn.addEventListener('click', () => {
  const next = prompt('Anthropic API anahtarını girin:', apiKey || '');
  if (next !== null) {
    apiKey = next.trim();
    localStorage.setItem(STORAGE_KEY, apiKey);
    addSystem(apiKey ? 'API anahtarı kaydedildi.' : 'API anahtarı silindi.');
  }
});

micBtn.addEventListener('click', () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    addSystem('Bu tarayıcı sesli komut desteklemiyor.');
    return;
  }
  const rec = new SpeechRecognition();
  rec.lang = 'tr-TR';
  rec.interimResults = false;
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    q.value = text;
    resizeTA();
  };
  rec.onerror = () => addSystem('Ses tanıma çalışmadı.');
  rec.start();
});

showHint();
resizeTA();
</script>
</body>
</html>
