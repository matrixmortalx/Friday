<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Friday</h1>
            <p>Sesli komutlu AI asistanı</p>
        </header>

        <main>
            <div class="chat-section">
                <div class="chat-box" id="chatBox">
                    <div class="message system">
                        <p>Merhaba! Ben Friday. Seni nasıl yardımcı olabilirim?</p>
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="promptInput" 
                            placeholder="Sorun yaz veya sesli komut kullan..."
                            class="input-field"
                        >
                        <button id="sendBtn" class="btn btn-send">Gönder</button>
                    </div>

                    <div class="button-group">
                        <button id="voiceBtn" class="btn btn-voice">🎤 Sesli Komut</button>
                        <button id="imageBtn" class="btn btn-image">🖼️ Resim Üret</button>
                        <button id="clearBtn" class="btn btn-clear">🗑️ Temizle</button>
                    </div>
                </div>
            </div>

            <div class="image-section" id="imageSection" style="display: none;">
                <h3>Üretilen Resim</h3>
                <img id="generatedImage" src="" alt="Üretilen resim" class="generated-image">
                <button id="downloadBtn" class="btn btn-download">⬇️ İndir</button>
            </div>
        </main>

        <footer>
            <p>Friday AI Backend: <span id="status">Kontrol ediliyor...</span></p>
            <p>API Durum: <span id="apiStatus" class="status-offline">Offline</span></p>
        </footer>
    </div>

    <div id="loadingSpinner" class="spinner" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
