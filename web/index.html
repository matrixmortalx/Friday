<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friday AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-shell">
    <div class="status-bar">
      <span>9:41</span>
      <div class="signal-icons">
        <span>◔</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <header class="app-header">
      <div>
        <p class="eyebrow">AI Assistant</p>
        <h1>Friday</h1>
      </div>
      <button class="mini-btn" id="clearBtn">Temizle</button>
    </header>

    <main class="app-body">
      <section class="hero-card">
        <div class="hero-icon">🤖</div>
        <div>
          <small>Voice + Vision</small>
          <strong>Akıllı yardımcı</strong>
        </div>
      </section>

      <section class="chat-panel">
        <div class="chat-box" id="chatBox">
          <div class="message system">
            <p>Merhaba! Ben Friday. Ne yapmamı istersin?</p>
          </div>
        </div>
      </section>

      <section class="quick-actions">
        <button class="chip">Yardım</button>
        <button class="chip">Resim üret</button>
        <button class="chip">Haber</button>
      </section>

      <section class="composer">
        <input id="promptInput" type="text" placeholder="Mesajını yaz veya konuş..." />
      </section>

      <section class="action-row">
        <button class="primary-btn" id="sendBtn">Gönder</button>
        <button class="secondary-btn" id="voiceBtn">🎤</button>
        <button class="secondary-btn" id="imageBtn">🖼️</button>
      </section>

      <section class="image-panel" id="imageSection" style="display:none;">
        <div class="image-header">
          <span>Üretilen Görsel</span>
          <button class="mini-btn" id="downloadBtn">İndir</button>
        </div>
        <img id="generatedImage" alt="Generated image" />
      </section>
    </main>

    <footer class="bottom-status">
      <span id="status">Backend kontrol ediliyor...</span>
      <span class="dot" id="apiStatus">Offline</span>
    </footer>
  </div>

  <div id="loadingSpinner" class="spinner" style="display:none;"></div>

  <script src="script.js"></script>
</body>
</html>
